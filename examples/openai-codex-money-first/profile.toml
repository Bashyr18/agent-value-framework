# OpenAI/Codex money-first reference profile
# Verified pricing snapshot: 2026-09-05. Update before production decisions.

[profile]
name = "openai-codex-money-first"
as_of = "2026-09-05"
objective = "minimum expected direct spend per accepted production-quality change"

[roles]
root = "sol_root"
default_worker = "luna_worker"
reviewer = "terra_reviewer"
rescue = "sol_rescue"
premium_adviser = "astra_adviser"

[capacity_policy]
unknown_entitlement = "conservative"
checkpoint_on_fallback = true
silent_model_downgrade = false

[capacity_policy.reserve]
mode = "fallback"
model_role = "luna_worker"
entitlement = "runtime-supplied"
availability = "runtime-supplied"
safe_policy = "allow"
conditional_policy = "reclassify"
prohibited_policy = "pause"

