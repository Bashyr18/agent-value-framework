[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-value-framework"
version = "0.2.0"
description = "Cost-aware routing framework for OpenAI Codex and coding agents: minimize spend per accepted change without weakening quality."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Value Framework contributors"}]
keywords = ["ai-agents", "codex", "orchestration", "cost-optimization", "coding-agents", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Bashyr18/agent-value-framework"
Repository = "https://github.com/Bashyr18/agent-value-framework"

[project.scripts]
avf = "agent_value_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
